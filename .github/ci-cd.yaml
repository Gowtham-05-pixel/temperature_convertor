name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: pytest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        TAG=$(git rev-parse --short HEAD)
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$TAG .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$TAG
        echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

    - name: Set up kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
        # Note: If executing deployments locally instead, you can skip the cluster deployment step inside GitHub Actions and run it manually using the generated tag.

    - name: Update Manifest and Deploy
      run: |
        TAG=$(git rev-parse --short HEAD)
        sed -i "s/IMAGE_TAG/$TAG/g" k8s/deployment.yaml
        cat k8s/deployment.yaml # Verification
        # kubectl apply -f k8s/deployment.yaml (Uncomment if using Remote K8s Secret cluster)
